<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E Booking - Confirmation</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            🎬 E BOOKING
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="index.html#now-showing">
                    Now Showing
                </a>
            </li>

            <li>
                <a href="index.html#featured">
                    Featured
                </a>
            </li>

        </ul>

    </nav>



    <!-- CONFIRMATION -->

    <section class="confirmation-section">

        <div class="confirmation-card">

            <div class="success-icon">
                ✓
            </div>


            <h1>Booking Confirmed!</h1>


            <p class="success-message">
                Your movie booking has been successfully confirmed.
            </p>



            <!-- BOOKING DETAILS -->

            <div class="confirmation-details">


                <div class="detail">

                    <span>🎬 Movie</span>

                    <strong id="confirmMovie">
                        -
                    </strong>

                </div>



                <div class="detail">

                    <span>📅 Date</span>

                    <strong id="confirmDate">
                        -
                    </strong>

                </div>



                <div class="detail">

                    <span>🕐 Show Time</span>

                    <strong id="confirmTime">
                        -
                    </strong>

                </div>



                <div class="detail">

                    <span>💺 Seats</span>

                    <strong id="confirmSeats">
                        -
                    </strong>

                </div>



                <div class="detail total">

                    <span>💰 Total Amount</span>

                    <strong>
                        ₹<span id="confirmAmount">0</span>
                    </strong>

                </div>


            </div>



            <p class="thank-you">
                Thank you for booking with E Booking! 🎉
            </p>



            <button
                class="home-btn"
                onclick="window.location.href='index.html'"
            >
                Back to Home
            </button>


        </div>

    </section>



    <!-- JAVASCRIPT -->

    <script src="./script.js"></script>


</body>

</html>
